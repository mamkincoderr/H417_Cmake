# Процедуры OpenOCD для H417_Cmake. Подключается после wch-dual-core.cfg и -c "chip_id CH32H417".
# Автор: Дмитрий (GitHub: mamkincoderr), Telegram: https://t.me/oDeXteRo
#
# cpu.0 = V3F (GDB 3333), cpu.1 = V5F (GDB 3334).
# V5F до пробуждения ядром V3F стоит на pc = 0: resume ему не давать, только сброс всего чипа.

# Корень проекта — по расположению этого файла (tools/h417.cfg): путь к склейке не зашит в конфигурации MRS.
set ::h417_root [file dirname [file dirname [string map {\\ /} [info script]]]]
set ::h417_merge "$::h417_root/obj/H417_Merge.hex"

# Аппаратные точки останова переживают сброс чипа: забытая (например, после убитой сессии GDB)
# останавливает ядро на каждом пуске. Снимаем все четыре на обоих ядрах.
proc h417_clear_bp {} {
    foreach t {wch_riscv.cpu.0 wch_riscv.cpu.1} {
        targets $t
        halt
        for {set i 0} {$i < 4} {incr i} {
            reg tselect $i
            reg tdata1 0
        }
    }
    targets wch_riscv.cpu.0
}

# Записать склейку обоих ядер, проверить и пустить чип сбросом.
proc h417_flash {file} {
    h417_clear_bp
    wch_riscv unfreeze
    program $file verify
    wlink_reset_resume
}

proc h417_reset {} {
    h417_clear_bp
    wlink_reset_resume
}

# Как ведут себя ядра под отладчиком (проверено 17.10.2026):
#   - init в OpenOCD останавливает оба ядра и сам их не пускает;
#   - остановка и пуск у ядер раздельные: стоит одно — второе работает;
#   - reset init останавливает и спящий V5F (pc = 0); такой V5F будильник ядра V3F не слышит;
#   - после reset run V3F стоит на 0, а V5F спит не остановленным и просыпается штатно.
# Поэтому старт: аппаратные точки останова (они переживают сброс) на main V3F и на входе V5F 0x10000,
# reset run, пуск одного V3F. V3F встаёт на main; когда его пустят дальше, он будит V5F, и тот встаёт на входе.
# hold_v5f = 0 — V5F не держать: отлаживается только V3F, V5F работает сам.
proc h417_debug_start {v3f_main {hold_v5f 1}} {
    h417_clear_bp
    wch_riscv unfreeze
    program $::h417_merge verify
    if {$hold_v5f} {
        targets wch_riscv.cpu.1
        bp 0x10000 2 hw
    }
    targets wch_riscv.cpu.0
    bp $v3f_main 2 hw
    reset run
    sleep 300
    targets wch_riscv.cpu.0
    wch_riscv.cpu.0 arp_poll
    if {[wch_riscv.cpu.0 curstate] eq "halted"} { resume }
    sleep 500
    wch_riscv.cpu.0 arp_poll
    rbp $v3f_main
    echo "H417: V3F [wch_riscv.cpu.0 curstate] at main, V5F held at 0x10000: $hold_v5f"
}

# Подключение V5F вместе с сессией V3F. Пускать V5F, стоящий на pc = 0 (ещё не разбужен ядром V3F), нельзя:
# он выполнит код V3F, и чип перестанет отвечать до RESET. Такой случай здесь отсекается ошибкой.
proc h417_v5f_attach {} {
    targets wch_riscv.cpu.1
    wch_riscv.cpu.1 arp_poll
    if {[wch_riscv.cpu.1 curstate] ne "halted"} { halt }
    set pc [lindex [split [reg pc] " "] end]
    if {$pc < 0x10000} {
        error "H417: V5F is not woken by V3F yet (pc=$pc). Resume V3F first, then attach V5F again."
    }
    # Точку на входе 0x10000 OpenOCD после reset run уже не помнит, а в ядре она взведена — снимаем в регистрах.
    for {set i 0} {$i < 4} {incr i} {
        reg tselect $i
        reg tdata1 0
    }
    echo "H417: V5F halted, pc=$pc"
}

# Подключение V5F без сессии V3F (прошивка уже работает). init остановил и V3F — пускаем его, пусть работает сам.
proc h417_v5f_solo {} {
    h417_v5f_attach
    targets wch_riscv.cpu.0
    wch_riscv.cpu.0 arp_poll
    if {[wch_riscv.cpu.0 curstate] eq "halted"} { resume }
    targets wch_riscv.cpu.1
}
